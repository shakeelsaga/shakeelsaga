<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="100%" height="100%" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,600;1,700&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap');
      .title-font { font-family: 'Silkscreen', monospace; font-size: 17px; font-weight: bold; fill: #000000; letter-spacing: 2px; }
      .hero-serif { font-family: 'Cinzel', serif; font-style: italic; font-weight: 700; font-size: 38px; fill: #000000; letter-spacing: -0.5px; line-height: 1.15; }
      .handle { font-family: 'Silkscreen', monospace; font-size: 14px; fill: #FFFFFF; letter-spacing: 1.5px; font-weight: bold; }
      .desc-text { font-family: 'Silkscreen', 'Geneva', monospace; font-size: 16px; line-height: 1.6; fill: #000000; letter-spacing: 0.5px; }
      .status-header-font { font-family: 'Silkscreen', monospace; font-size: 12px; font-weight: bold; fill: #FFFFFF; letter-spacing: 1.5px; }
      .tags-text { font-family: 'Silkscreen', monospace; font-size: 15.5px; font-weight: bold; fill: #000000; letter-spacing: 1.2px; }
    </style>
    <pattern id="stripes-small-intro-v2" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="4" y2="1" stroke="#000000" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Hard Black Offset Shadow -->
  <rect x="12" y="12" width="618" height="518" fill="#000000"/>

  <!-- Main Window Body Frame -->
  <rect x="6" y="6" width="620" height="520" fill="#FBFBFA" stroke="#000000" stroke-width="4"/>
  <rect x="12" y="12" width="608" height="508" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Window Title Bar -->
  <rect x="16" y="16" width="600" height="48" fill="url(#stripes-small-intro-v2)" stroke="#000000" stroke-width="2"/>
  
  <!-- Left Close Box Widget -->
  <rect x="26" y="26" width="28" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- Title Plaque -->
  <rect x="196" y="22" width="248" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="320" y="47" text-anchor="middle" class="title-font">INTRODUCTION</text>

  <!-- Right Collapse Widget -->
  <rect x="580" y="26" width="28" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="586" y="32" width="16" height="16" fill="#000000"/>

  <!-- Window Content Inner -->
  <!-- Top decorative prompt line -->
  <g transform="translate(36, 88)">
    <!-- Small 1-bit Terminal Icon -->
    <rect x="0" y="0" width="32" height="32" fill="#000000"/>
    <rect x="3" y="3" width="26" height="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="7" y="22" font-family="'Silkscreen', monospace" font-size="14" font-weight="bold" fill="#000000">&gt;_</text>
    
    <!-- Fixed Handle Badge in Inverse 1-bit Black with ample width and crisp 14px type -->
    <rect x="42" y="0" width="260" height="32" fill="#000000"/>
    <rect x="44" y="2" width="256" height="28" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="172" y="21" text-anchor="middle" class="handle">aka shakeelsaga</text>
  </g>

  <!-- Expressive Display Typography (Argent Pixel CF Italic equivalent) -->
  <text x="36" y="166" class="hero-serif">Hello.</text>
  <text x="36" y="214" class="hero-serif">I'm Mohammed Shakeel.</text>

  <!-- Horizontal divider with 1-bit pixel notches -->
  <line x1="36" y1="248" x2="596" y2="248" stroke="#000000" stroke-width="2"/>
  <rect x="36" y="244" width="8" height="8" fill="#000000"/>
  <rect x="588" y="244" width="8" height="8" fill="#000000"/>

  <!-- Editorial Biography statement with enlarged font -->
  <text x="36" y="292" class="desc-text">DevOps &amp; cloud engineer building</text>
  <text x="36" y="324" class="desc-text">infrastructure, containers, and</text>
  <text x="36" y="356" class="desc-text">observability systems.</text>

  <!-- Inner Status Box / Functional Line with scaled typography -->
  <rect x="36" y="396" width="560" height="92" fill="#F4F4F2" stroke="#000000" stroke-width="2"/>
  <rect x="36" y="396" width="560" height="26" fill="#000000"/>
  <text x="48" y="414" class="status-header-font">CORE DISCIPLINE &amp; TOOLING</text>
  <text x="48" y="456" class="tags-text">Kubernetes · AWS · Terraform · Python</text>

  <!-- Bottom-right resize thumb widget -->
  <path d="M 600 500 L 610 500 L 610 510 Z M 590 510 L 610 510 L 610 490 Z" fill="#000000"/>
</svg>
