<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;display=swap');
      .header-title { font-family: 'Silkscreen', monospace; font-size: 20px; font-weight: bold; fill: #000000; letter-spacing: 2.5px; }
      .header-sub { font-family: 'Silkscreen', monospace; font-size: 11px; fill: #000000; letter-spacing: 1.5px; }
    </style>
    <!-- Classic Macintosh horizontal pinstripes -->
    <pattern id="proj-hdr-stripes-120" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="4" y2="1" stroke="#000000" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Hard Black Offset Shadow matching project cards and system style -->
  <rect x="12" y="12" width="616" height="98" fill="#000000"/>

  <!-- Main Window Title Bar Outer Frame (Height extended to 102 to fill 120 canvas) -->
  <rect x="6" y="6" width="620" height="102" fill="#FBFBFA" stroke="#000000" stroke-width="4"/>
  <rect x="12" y="12" width="608" height="90" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Pinstriped interior fill -->
  <rect x="16" y="16" width="600" height="82" fill="url(#proj-hdr-stripes-120)" stroke="#000000" stroke-width="2"/>

  <!-- Left Close Box Widget (Centered vertically: Y center = 57, height = 44) -->
  <rect x="28" y="35" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="36" y="43" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Left 1-Bit Code/Folder Mini Glyph -->
  <g transform="translate(82, 35)">
    <rect x="0" y="0" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="8" y="12" width="28" height="22" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path d="M 8 12 L 17 12 L 21 17 L 36 17" fill="none" stroke="#000000" stroke-width="2.5"/>
  </g>

  <!-- Centered Title Plaque (Centered vertically: Y = 28, height = 58) -->
  <rect x="175" y="28" width="290" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="180" y="33" width="280" height="48" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="58" text-anchor="middle" class="header-title">PROJECTS</text>
  <text x="320" y="73" text-anchor="middle" class="header-sub">FEATURED_REPOSITORIES</text>

  <!-- Right Command & Zoom Widgets -->
  <g transform="translate(514, 35)">
    <rect x="0" y="0" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="11" y="11" width="22" height="22" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="17" y="17" width="10" height="10" fill="#000000"/>
  </g>
  <g transform="translate(568, 35)">
    <rect x="0" y="0" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <!-- Classic Apple / Mac Clover icon in 1-bit -->
    <path d="M 15 15 C 11 11 11 18 15 18 L 19 18 L 19 15 C 19 11 11 11 15 15 Z M 29 15 C 33 11 33 18 29 18 L 25 18 L 25 15 C 25 11 33 11 29 15 Z M 15 29 C 11 33 11 26 15 26 L 19 26 L 19 29 C 19 33 11 33 15 29 Z M 29 29 C 33 33 33 26 29 26 L 25 26 L 25 29 C 25 33 33 33 29 29 Z" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
