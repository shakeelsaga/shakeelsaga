<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,700&amp;family=Silkscreen:wght@400;700&amp;display=swap');
      .chicago-title { font-family: 'Silkscreen', monospace; font-size: 16px; font-weight: bold; fill: #FFFFFF; letter-spacing: 2px; }
      .proj-title { font-family: 'Cinzel', serif; font-style: italic; font-weight: 700; font-size: 32px; fill: #000000; letter-spacing: 0.5px; }
      .proj-desc { font-family: 'Silkscreen', 'Geneva', monospace; font-size: 14.5px; line-height: 1.45; fill: #000000; letter-spacing: 0.5px; }
      .meta-tag { font-family: 'Silkscreen', monospace; font-size: 12px; font-weight: bold; fill: #000000; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Hard Black Offset Shadow matching 640x260 specifications -->
  <rect x="12" y="12" width="616" height="238" fill="#000000"/>
  
  <!-- Outer Window Frame -->
  <rect x="6" y="6" width="620" height="240" fill="#FBFBFA" stroke="#000000" stroke-width="4"/>
  <rect x="12" y="12" width="608" height="228" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Inverse Black Title Bar -->
  <rect x="16" y="16" width="600" height="38" fill="#000000"/>
  <!-- Classic Close Box -->
  <rect x="24" y="23" width="24" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- Title & Status Tag -->
  <text x="60" y="41" class="chicago-title">PROJECTS // 03</text>
  <text x="596" y="41" text-anchor="end" font-family="'Silkscreen', monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF">[AWS_LAMBDA]</text>

  <!-- Content Area (Recomposed vertically for 260px artboard) -->
  <g transform="translate(30, 66)">
    <!-- 1-Bit Lambda / Cloud Compute Glyph (56x56 px) -->
    <g transform="translate(0, 6)">
      <rect x="0" y="0" width="56" height="56" fill="#000000"/>
      <rect x="4" y="4" width="48" height="48" fill="#FFFFFF"/>
      <line x1="16" y1="43" x2="28" y2="13" stroke="#000000" stroke-width="4"/>
      <line x1="24" y1="26" x2="40" y2="43" stroke="#000000" stroke-width="4"/>
    </g>

    <!-- Title in Argent Pixel CF Italic style -->
    <text x="76" y="38" class="proj-title">Serverless Functions</text>
    
    <!-- Verbatim Description lines -->
    <text x="76" y="72" class="proj-desc">Terraform-powered AWS automation,</text>
    <text x="76" y="96" class="proj-desc">built in Python</text>
    
    <!-- Meta separator line & Tags -->
    <line x1="76" y1="116" x2="574" y2="116" stroke="#000000" stroke-width="2"/>
    <text x="76" y="138" class="meta-tag">TERRAFORM · AWS LAMBDA · PYTHON · BOTO3</text>
  </g>
</svg>
