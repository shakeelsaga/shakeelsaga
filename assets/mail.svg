<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;display=swap');
      .chicago-bar { font-family: 'Silkscreen', monospace; font-size: 13px; font-weight: bold; fill: #FFFFFF; letter-spacing: 1.5px; }
      .tile-title { font-family: 'Silkscreen', monospace; font-size: 22px; font-weight: bold; fill: #000000; letter-spacing: 1.5px; }
      .tile-subtitle { font-family: 'Silkscreen', monospace; font-size: 12px; font-weight: bold; fill: #000000; letter-spacing: 1px; }
      .status-text { font-family: 'Silkscreen', monospace; font-size: 12px; fill: #000000; letter-spacing: 0.5px; }
      .dest-label { font-family: 'Silkscreen', monospace; font-size: 11px; fill: #FFFFFF; letter-spacing: 1.5px; }
      .mail-user { font-family: 'Silkscreen', monospace; font-size: 12.5px; font-weight: bold; fill: #FFFFFF; letter-spacing: 0.5px; }
      .mail-domain { font-family: 'Silkscreen', monospace; font-size: 13px; font-weight: bold; fill: #FFFFFF; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Hard Black Offset Shadow -->
  <rect x="10" y="10" width="300" height="420" fill="#000000"/>

  <!-- Main Card Body -->
  <rect x="4" y="4" width="302" height="422" fill="#FBFBFA" stroke="#000000" stroke-width="4"/>
  <rect x="8" y="8" width="294" height="414" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Mini Title Bar -->
  <rect x="12" y="12" width="286" height="34" fill="#000000"/>
  <rect x="18" y="18" width="20" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="46" y="34" class="chicago-bar">CONTACT // 03</text>
  <text x="286" y="34" text-anchor="end" font-family="'Silkscreen', monospace" font-size="11" fill="#FFFFFF">[SMTP]</text>

  <!-- 1-Bit Mail Envelope Icon in Black -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="68" height="68" fill="#000000"/>
    <rect x="4" y="4" width="60" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <rect x="8" y="8" width="52" height="52" fill="#000000"/>
    <!-- Envelope body -->
    <rect x="14" y="20" width="40" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <polyline points="15,22 34,36 53,22" fill="none" stroke="#000000" stroke-width="3"/>
    <line x1="15" y1="46" x2="28" y2="34" stroke="#000000" stroke-width="2"/>
    <line x1="53" y1="46" x2="40" y2="34" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Title & Subtitle with increased font sizes -->
  <text x="106" y="92" class="tile-title">Mail</text>
  <text x="106" y="116" class="tile-subtitle">DIRECT_INBOX</text>

  <!-- Mid separator line with notched ends -->
  <line x1="24" y1="148" x2="286" y2="148" stroke="#000000" stroke-width="2"/>
  <rect x="24" y="145" width="6" height="6" fill="#000000"/>
  <rect x="280" y="145" width="6" height="6" fill="#000000"/>

  <!-- Status Box -->
  <rect x="24" y="170" width="262" height="96" fill="#F4F4F2" stroke="#000000" stroke-width="2"/>
  <rect x="24" y="170" width="262" height="22" fill="#000000"/>
  <text x="32" y="186" font-family="'Silkscreen', monospace" font-size="11" fill="#FFFFFF" letter-spacing="1">MAIL PROTOCOL &amp; CIPHER</text>
  <text x="36" y="218" class="status-text">PROTOCOL: SMTP / POP</text>
  <text x="36" y="244" class="status-text">ENCRYPT: PGP READY</text>

  <!-- Destination URI Handle Block with fixed unbroken full address -->
  <g transform="translate(24, 286)">
    <rect x="0" y="0" width="262" height="114" fill="#000000"/>
    <rect x="4" y="4" width="254" height="106" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="131" y="32" text-anchor="middle" class="dest-label">&gt; DIRECT ADDRESS &lt;</text>
    <line x1="16" y1="46" x2="246" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Unbroken full email clearly typeset on two balanced, prominent lines -->
    <text x="131" y="72" text-anchor="middle" class="mail-user">shakeelmohammedofficial</text>
    <text x="131" y="94" text-anchor="middle" class="mail-domain">@gmail.com</text>
  </g>
</svg>
