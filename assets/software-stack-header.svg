<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;display=swap');
      .header-title { font-family: 'Silkscreen', monospace; font-size: 22px; font-weight: bold; fill: #000000; letter-spacing: 3px; }
      .header-sub { font-family: 'Silkscreen', monospace; font-size: 11.5px; fill: #000000; letter-spacing: 2px; }
    </style>
    <!-- Classic horizontal Macintosh title bar pinstripes -->
    <pattern id="sw-hdr-stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="4" y2="1" stroke="#000000" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Hard Black Offset Shadow -->
  <rect x="12" y="12" width="1256" height="96" fill="#000000"/>

  <!-- Outer Window Chrome -->
  <rect x="6" y="6" width="1260" height="100" fill="#FBFBFA" stroke="#000000" stroke-width="4"/>
  <rect x="12" y="12" width="1248" height="88" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Pinstriped interior fill -->
  <rect x="16" y="16" width="1240" height="80" fill="url(#sw-hdr-stripes)" stroke="#000000" stroke-width="2"/>

  <!-- Left Close Box Widget -->
  <rect x="32" y="32" width="48" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="42" y="42" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Left Chip / Microprocessor Glyph (matching system tools theme) -->
  <g transform="translate(96, 32)">
    <rect x="0" y="0" width="48" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="12" y="12" width="24" height="24" fill="#000000"/>
    <rect x="18" y="18" width="12" height="12" fill="#FFFFFF"/>
    <!-- Chip pins -->
    <line x1="16" y1="6" x2="16" y2="12" stroke="#000000" stroke-width="2"/>
    <line x1="24" y1="6" x2="24" y2="12" stroke="#000000" stroke-width="2"/>
    <line x1="32" y1="6" x2="32" y2="12" stroke="#000000" stroke-width="2"/>
    <line x1="16" y1="36" x2="16" y2="42" stroke="#000000" stroke-width="2"/>
    <line x1="24" y1="36" x2="24" y2="42" stroke="#000000" stroke-width="2"/>
    <line x1="32" y1="36" x2="32" y2="42" stroke="#000000" stroke-width="2"/>
    <line x1="6" y1="16" x2="12" y2="16" stroke="#000000" stroke-width="2"/>
    <line x1="6" y1="24" x2="12" y2="24" stroke="#000000" stroke-width="2"/>
    <line x1="6" y1="32" x2="12" y2="32" stroke="#000000" stroke-width="2"/>
    <line x1="36" y1="16" x2="42" y2="16" stroke="#000000" stroke-width="2"/>
    <line x1="36" y1="24" x2="42" y2="24" stroke="#000000" stroke-width="2"/>
    <line x1="36" y1="32" x2="42" y2="32" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Centered Title Plaque -->
  <rect x="360" y="24" width="560" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="366" y="30" width="548" height="52" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="640" y="60" text-anchor="middle" class="header-title">SOFTWARE STACK</text>
  <text x="640" y="74" text-anchor="middle" class="header-sub">CORE ENGINES &amp; INFRASTRUCTURE // SYS.DEV.TOOLS</text>

  <!-- Right Command Clover & Zoom Widgets -->
  <g transform="translate(1136, 32)">
    <rect x="0" y="0" width="48" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="12" y="12" width="24" height="24" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="18" y="18" width="12" height="12" fill="#000000"/>
  </g>
  <g transform="translate(1196, 32)">
    <rect x="0" y="0" width="48" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <!-- Classic Apple Clover in 1-bit -->
    <path d="M 16 16 C 12 12 12 20 16 20 L 20 20 L 20 16 C 20 12 12 12 16 16 Z M 32 16 C 36 12 36 20 32 20 L 28 20 L 28 16 C 28 12 36 12 32 16 Z M 16 32 C 12 36 12 28 16 28 L 20 28 L 20 32 C 20 36 12 36 16 32 Z M 32 32 C 36 36 36 28 32 28 L 28 28 L 28 32 C 28 36 36 36 32 32 Z" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
