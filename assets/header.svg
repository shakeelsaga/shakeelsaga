<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 160" width="1920" height="160" style="background:#000000;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Silkscreen&amp;family=VT323&amp;display=swap');
      .stripe { stroke: #000000; stroke-width: 2; }
      .chicago { font-family: 'Silkscreen', 'Geneva', monospace; font-size: 28px; font-weight: bold; fill: #000000; letter-spacing: 2px; }
      .serif-sub { font-family: 'Cinzel', 'Georgia', serif; font-style: italic; font-size: 20px; fill: #000000; }
    </style>
    <!-- 1-bit Macintosh title bar pin-stripes pattern -->
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="4" y2="1" stroke="#000000" stroke-width="2"/>
    </pattern>
    <pattern id="checker" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000000"/>
      <rect x="2" y="2" width="2" height="2" fill="#000000"/>
      <rect x="2" width="2" height="2" fill="#ffffff"/>
      <rect y="2" width="2" height="2" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- Hard offset shadow for window -->
  <rect x="14" y="14" width="1896" height="136" fill="#000000" />

  <!-- Main Window Frame (Off-white/white) -->
  <rect x="6" y="6" width="1904" height="144" fill="#F8F8F6" stroke="#000000" stroke-width="4" />
  
  <!-- Outer Double-border line characteristic of Mac OS windows -->
  <rect x="12" y="12" width="1892" height="132" fill="none" stroke="#000000" stroke-width="2" />

  <!-- Window Title Bar with horizontal pinstripes -->
  <rect x="18" y="18" width="1880" height="120" fill="url(#stripes)" stroke="#000000" stroke-width="2" />

  <!-- Left Mac Classic Close Box Widget -->
  <rect x="40" y="44" width="68" height="68" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
  <rect x="52" y="56" width="44" height="44" fill="none" stroke="#000000" stroke-width="2" />

  <!-- Left decorative system glyph: 1-bit tiny Mac icon -->
  <g transform="translate(130, 42)">
    <rect x="0" y="0" width="68" height="72" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="2"/>
    <rect x="8" y="8" width="52" height="38" fill="#000000" />
    <rect x="12" y="12" width="44" height="30" fill="#FFFFFF" />
    <!-- Happy Mac face -->
    <rect x="22" y="20" width="4" height="6" fill="#000000"/>
    <rect x="42" y="20" width="4" height="6" fill="#000000"/>
    <path d="M 24 32 Q 34 38 44 32" stroke="#000000" stroke-width="3" fill="none"/>
    <!-- Floppy slot -->
    <line x1="16" y1="58" x2="52" y2="58" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- Center Title Plaque -->
  <rect x="540" y="32" width="840" height="92" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
  <rect x="546" y="38" width="828" height="80" fill="none" stroke="#000000" stroke-width="2" />
  
  <text x="960" y="88" text-anchor="middle" class="chicago">SHAKEELSAGA CONTROL PANEL</text>
  <text x="960" y="106" text-anchor="middle" font-family="'Silkscreen', monospace" font-size="12px" fill="#000000" letter-spacing="4px">SYS.VER. 4.2 · DESK ACCESSORY · DEV_PORTFOLIO</text>

  <!-- Right Mac Classic Zoom/Collapse Boxes & Scroll Arrows -->
  <g transform="translate(1730, 44)">
    <!-- Right decorative controls box -->
    <rect x="0" y="0" width="68" height="68" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <rect x="14" y="14" width="40" height="40" fill="none" stroke="#000000" stroke-width="3" />
    <rect x="24" y="24" width="20" height="20" fill="#000000" />
  </g>
  <g transform="translate(1820, 44)">
    <rect x="0" y="0" width="68" height="68" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- 1-bit System Clover / Command symbol -->
    <path d="M 22 22 C 16 16 16 28 22 28 L 28 28 L 28 22 C 28 16 16 16 22 22 Z M 46 22 C 52 16 52 28 46 28 L 40 28 L 40 22 C 40 16 52 16 46 22 Z M 22 46 C 16 52 16 40 22 40 L 28 40 L 28 46 C 28 52 16 52 22 46 Z M 46 46 C 52 52 52 40 46 40 L 40 40 L 40 46 C 40 52 52 52 46 46 Z" fill="none" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
